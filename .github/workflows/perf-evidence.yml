# Perf Evidence: isolated weekly benchmark-evidence workflow (Phase 22).
# Advisory only: dated artifacts plus a 90-day retention window. This file
# never touches release lineage and never gates the 12h update workflow.
name: Perf Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2"  # Tue 03:17 UTC per D-22-01

permissions: {}

concurrency:
  group: perf-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  perf_evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: python -m pip install -q -c constraints/release-py314.txt ".[dev]"

      - name: Prepare Evidence Directories
        run: mkdir -p reports/perf-evidence reports/benchmarks/runs previous

      - name: Stamp Evidence Date
        id: stamp
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Download Prior Perf Evidence (skeleton)
        # 22-02 wires the baseline run-id resolver; the skeleton only pins the
        # supply-chain surface and stays inert until then.
        if: false
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: perf-evidence-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.run_id }}
          path: previous

      - name: Upload Perf Evidence (skeleton)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: perf-evidence-${{ steps.stamp.outputs.date }}-${{ github.run_id }}
          path: |
            reports/perf-evidence/**
            reports/benchmarks/**
          if-no-files-found: warn
          retention-days: 90
