# Perf Evidence: isolated weekly benchmark-evidence workflow (Phase 22 + 24).
# Advisory only: dated artifacts plus a 90-day retention window and isolated
# advisory issue tracking. This file never touches release lineage and never
# gates the 12h update workflow.
name: Perf Evidence
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.smoke_mode != '' && inputs.smoke_mode != 'none' && format('Perf Evidence [SMOKE {0}]', inputs.smoke_mode) || 'Perf Evidence' }}

on:
  workflow_dispatch:
    inputs:
      smoke_mode:
        description: "Isolated alert smoke test mode (none = normal production measurement)"
        required: false
        default: none
        type: choice
        options:
          - none
          - regression
          - partial_recovery
          - recovery
          - degraded

  schedule:
    - cron: "17 3 * * 2"  # Tue 03:17 UTC per D-22-01

# Snapshot lifecycle (self-seed story, D-22-04):
# - Self-seed on restore miss: when the pinned restore 404s (pre-seed,
#   expiry), the workflow freezes the current live fetch, uploads it as
#   perf-snapshot-<newdigest12>, and records the full digest plus an
#   "open a PR to pin it" note in the step summary.
# - Pinning is deliberate: a human PR touches only PERF_SNAPSHOT_DIGEST and
#   PERF_SNAPSHOT_RUN_ID below, nothing else in this file.
# - Re-seed ~quarterly before the 90-day artifact expiry; snapshot bytes are
#   never committed to git and never travel through a shared runner-cache
#   key family.
env:
  SOURCES: config/sources.txt
  RAW_DIR: lists/_raw
  PERF_SNAPSHOT_DIGEST: 68dc7a1c231de50293d64943943a5512a737c18946edf170ff1e0aeb6936a59a
  PERF_SNAPSHOT_ARTIFACT: perf-snapshot-68dc7a1c231d
  # Seeded by run 34037935171 self-seed (2026-09-06); replace with a fresh
  # self-seeded digest by human PR ~quarterly before the 90-day expiry.
  PERF_SNAPSHOT_RUN_ID: "34037935171"
  PINNED_DIR: reports/perf-evidence/pinned-corpus

permissions: {}

concurrency:
  group: perf-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  perf_evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: python -m pip install -q -c constraints/release-py314.txt ".[dev]"

      - name: Prepare Evidence Directories
        run: mkdir -p reports/perf-evidence reports/benchmarks/runs previous "$PINNED_DIR"

      - name: Stamp Evidence Date
        id: stamp
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore pinned snapshot
        id: restore
        if: (github.event_name != 'workflow_dispatch' || (inputs.smoke_mode || 'none') == 'none')
        # Graceful by design: a missing snapshot (pre-seed, expiry) skips the
        # pinned legs below and the week degrades to raw-only, job stays green.
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ env.PERF_SNAPSHOT_ARTIFACT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.PERF_SNAPSHOT_RUN_ID }}
          path: ${{ env.PINNED_DIR }}

      - name: Run pinned timing leg
        id: pinned-timing
        # outcome (not conclusion): continue-on-error above forces conclusion
        # to success even on 404, so only outcome reflects real restore state.
        if: always() && steps.restore.outcome == 'success' && (github.event_name != 'workflow_dispatch' || (inputs.smoke_mode || 'none') == 'none')
        continue-on-error: true
        run: |
          python -m scripts.benchmark --corpus "$PINNED_DIR" --runs 3 \
            --json reports/benchmarks/runs/pinned-timing.json || true

      - name: Run pinned memory leg
        id: pinned-memory
        # outcome (not conclusion): see the timing leg above; only outcome
        # reflects real restore state under continue-on-error.
        if: always() && steps.restore.outcome == 'success' && (github.event_name != 'workflow_dispatch' || (inputs.smoke_mode || 'none') == 'none')
        continue-on-error: true
        run: |
          python -m scripts.benchmark --corpus "$PINNED_DIR" \
            --track-memory --json reports/benchmarks/runs/pinned-memory.json || true

      - name: Verify pinned manifest
        id: pinned-verify
        # Post-leg gate: restored bytes must match the env-pinned digest before
        # any trend delta is credited. Drift (or a missing leg) writes the
        # marker plus output flag and the week goes raw-only, job stays green.
        if: always() && (github.event_name != 'workflow_dispatch' || (inputs.smoke_mode || 'none') == 'none')
        run: |
          PINNED_REPORT=reports/benchmarks/runs/pinned-timing.json
          DRIFTED=true
          if [ -f "$PINNED_REPORT" ]; then
            STAMPED=$(python -c "import json,sys; data=json.load(open(sys.argv[1],encoding='utf-8')); print(data.get('manifest_sha256') or data.get('corpus',{}).get('manifest_sha256',''))" "$PINNED_REPORT" 2>/dev/null || true)
            if [ -n "$STAMPED" ] && [ "$STAMPED" = "$PERF_SNAPSHOT_DIGEST" ]; then
              DRIFTED=false
            fi
          fi
          if [ "$DRIFTED" = "true" ]; then
            echo "Pinned leg drifted or missing: marking raw-only, job stays green."
            : > reports/perf-evidence/pinned-drifted
          fi
          echo "drifted=${DRIFTED}" >> "$GITHUB_OUTPUT"
          exit 0

      # Live-leg cache posture: scratch cache only (.cache-perf). The corpus
      # target reuses the conventional RAW_DIR path inside this run's ephemeral
      # workspace; this job never restores/saves shared cache key families.
      # Fetch reds intentionally on infra failure (a broken fetch is a real
      # signal); tooling/drift/missing-snapshot paths stay green by design.
      - name: Fetch live sources
        id: fetch
        if: (github.event_name != 'workflow_dispatch' || (inputs.smoke_mode || 'none') == 'none')
        run: |
          python -m scripts.downloader \
            --sources "$SOURCES" \
            --outdir "$RAW_DIR" \
            --cache .cache-perf \
            --concurrency 10 \
            --timeout 25 \
            --health-report reports/perf-evidence/source-health.json

      - name: Run live timing leg
        id: live-timing
        if: always() && (github.event_name != 'workflow_dispatch' || (inputs.smoke_mode || 'none') == 'none')
        continue-on-error: true
        run: |
          python -m scripts.benchmark --corpus "$RAW_DIR" --runs 3 \
            --json reports/benchmarks/runs/live-timing.json || true

      - name: Run live memory leg
        id: live-memory
        if: always() && (github.event_name != 'workflow_dispatch' || (inputs.smoke_mode || 'none') == 'none')
        continue-on-error: true
        run: |
          python -m scripts.benchmark --corpus "$RAW_DIR" \
            --track-memory --json reports/benchmarks/runs/live-memory.json || true

      - name: Prepare self-seed snapshot on restore miss
        id: self-seed
        # Self-seed procedure (see the lifecycle note above): on a restore
        # miss, freeze the current live fetch for a human PR to pin.
        if: always() && steps.restore.outcome != 'success' && (github.event_name != 'workflow_dispatch' || (inputs.smoke_mode || 'none') == 'none')
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          DIGEST=$(python -c "import json,sys; data=json.load(open(sys.argv[1],encoding='utf-8')); print(data.get('manifest_sha256') or data.get('corpus',{}).get('manifest_sha256',''))" reports/benchmarks/runs/live-timing.json 2>/dev/null || true)
          if [ -z "$DIGEST" ]; then
            echo "Self-seed skipped: live corpus report unavailable."
            echo "Self-seed skipped: live corpus report unavailable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SHORT12=$(printf '%s' "$DIGEST" | cut -c1-12)
          mkdir -p reports/perf-evidence/self-seed-stage
          cp "$RAW_DIR"/*.txt reports/perf-evidence/self-seed-stage/ 2>/dev/null || true
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "digest12=${SHORT12}" >> "$GITHUB_OUTPUT"
          {
            echo "Self-seed snapshot ready: perf-snapshot-${SHORT12}"
            echo "Full digest: ${DIGEST}"
            echo "Open a PR to pin it: set PERF_SNAPSHOT_DIGEST to the full digest and PERF_SNAPSHOT_RUN_ID to ${RUN_ID}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload self-seeded snapshot
        # Dynamic name carries the staged digest12; guarded on a prepared
        # digest so seeded weeks stay green with or without a miss.
        if: always() && steps.self-seed.outputs.digest12 != '' && (github.event_name != 'workflow_dispatch' || (inputs.smoke_mode || 'none') == 'none')
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: perf-snapshot-${{ steps.self-seed.outputs.digest12 }}
          path: reports/perf-evidence/self-seed-stage/*.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Collect Environment Receipts
        # Every report bundle carries environment receipts per PERF-04: CPU
        # model via lscpu, runner image via ImageOS/ImageVersion with an
        # os-release fallback plus a runner-log reference when empty, Python
        # patch version, both corpus manifest digests read from the fresh leg
        # reports, and the workflow-owned revision identifiers. Missing inputs
        # degrade to labeled unknown values, never to forged numbers.
        # Always-run so a failed leg still leaves partial receipts behind.
        if: always() && (github.event_name != 'workflow_dispatch' || (inputs.smoke_mode || 'none') == 'none')
        continue-on-error: true
        env:
          GIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p reports/perf-evidence
          if command -v lscpu >/dev/null 2>&1; then
            lscpu > reports/perf-evidence/cpu.txt 2>/dev/null || echo "cpu: unknown (lscpu failed)" > reports/perf-evidence/cpu.txt
          else
            echo "cpu: unknown (lscpu unavailable)" > reports/perf-evidence/cpu.txt
          fi
          CPU_MODEL=$(grep -m1 -i "model name" reports/perf-evidence/cpu.txt 2>/dev/null | cut -d: -f2- | sed 's/^ *//' || true)
          if [ -z "$CPU_MODEL" ]; then
            CPU_MODEL="unknown"
          fi
          RUNNER_IMAGE="${ImageOS:-}"
          RUNNER_IMAGE_VERSION="${ImageVersion:-}"
          if [ -z "$RUNNER_IMAGE" ]; then
            RUNNER_IMAGE=$(grep -m1 '^PRETTY_NAME=' /etc/os-release 2>/dev/null | cut -d= -f2- | tr -d '"' || true)
          fi
          if [ -z "$RUNNER_IMAGE" ]; then
            RUNNER_IMAGE="unknown (see the runner log)"
          fi
          if [ -z "$RUNNER_IMAGE_VERSION" ]; then
            RUNNER_IMAGE_VERSION="unknown (see the runner log)"
          fi
          PYTHON_VERSION=$(python --version 2>&1 || echo "Python unknown")
          export CPU_MODEL RUNNER_IMAGE RUNNER_IMAGE_VERSION PYTHON_VERSION
          RECEIPTS_SHA="$GIT_SHA" RECEIPTS_RUN="$RUN_ID" python - <<'PY'
          import json
          import os
          from pathlib import Path


          def _manifest(path):
              try:
                  data = json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return ""
              if not isinstance(data, dict):
                  return ""
              manifest = data.get("manifest_sha256")
              if not manifest:
                  corpus = data.get("corpus")
                  if isinstance(corpus, dict):
                      manifest = corpus.get("manifest_sha256", "")
              return manifest or ""


          receipts = {
              "cpu_model": os.environ.get("CPU_MODEL", "unknown"),
              "runner_image": os.environ.get("RUNNER_IMAGE", "unknown"),
              "runner_image_version": os.environ.get("RUNNER_IMAGE_VERSION", "unknown"),
              "python_version": os.environ.get("PYTHON_VERSION", "unknown"),
              "pinned_manifest_sha256": _manifest("reports/benchmarks/runs/pinned-timing.json"),
              "live_manifest_sha256": _manifest("reports/benchmarks/runs/live-timing.json"),
              "git_revision": os.environ.get("RECEIPTS_SHA", "unknown"),
              "run_id": os.environ.get("RECEIPTS_RUN", "unknown"),
          }
          if not receipts["pinned_manifest_sha256"]:
              receipts["pinned_manifest_sha256"] = "unknown (pinned leg missing or drifted)"
          if not receipts["live_manifest_sha256"]:
              receipts["live_manifest_sha256"] = "unknown (live leg missing)"
          Path("reports/perf-evidence/receipts.json").write_text(
              json.dumps(receipts, indent=2) + "\n", encoding="utf-8"
          )
          print("receipts written to reports/perf-evidence/receipts.json")
          PY

      - name: Resolve baseline run id
        id: baseline
        # Cross-branch baselines are acceptable: corpus content is
        # branch-independent upstream fetches, so no --branch scoping.
        # Always-run (on non-smoke runs) so non-pinned failures do not skip
        # rolling baseline lookup (D-24-05), and exclude [SMOKE runs (D-24-14).
        if: always() && (github.event_name != 'workflow_dispatch' || (inputs.smoke_mode || 'none') == 'none')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RID=$(gh run list --workflow perf-evidence.yml --status success --limit 100 --json databaseId,displayTitle --jq '[.[] | select((.displayTitle // "") | startswith("Perf Evidence [SMOKE") | not)] | .[0].databaseId // empty' || true)
          echo "run-id=${RID}" >> "$GITHUB_OUTPUT"

      - name: Download prior report
        id: download-prior
        # Guarded on a resolved prior run; always-run on non-smoke runs so
        # non-pinned leg failures preserve rolling baseline data (D-24-05).
        if: always() && steps.baseline.outputs.run-id != '' && (github.event_name != 'workflow_dispatch' || (inputs.smoke_mode || 'none') == 'none')
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: perf-evidence-baseline-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.baseline.outputs.run-id }}
          path: previous

      - name: Stage baseline report
        # Flat stage pinned-timing, live-timing, and receipts.json into one
        # directory so Download prior report extracts previous/*.json flat (D-24-04).
        if: always() && (github.event_name != 'workflow_dispatch' || (inputs.smoke_mode || 'none') == 'none')
        continue-on-error: true
        run: |
          rm -rf reports/perf-evidence/baseline-stage
          mkdir -p reports/perf-evidence/baseline-stage
          for src in \
            reports/benchmarks/runs/pinned-timing.json \
            reports/benchmarks/runs/live-timing.json \
            reports/perf-evidence/receipts.json; do
            if [ -f "$src" ]; then
              cp "$src" reports/perf-evidence/baseline-stage/
            fi
          done

      - name: Upload baseline report
        # Stable name feeds next week's rolling compare for both legs and
        # environment receipts. The dated bundle below keeps the per-week copy.
        if: always() && (github.event_name != 'workflow_dispatch' || (inputs.smoke_mode || 'none') == 'none')
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: perf-evidence-baseline-report
          path: reports/perf-evidence/baseline-stage/*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Compare pinned leg vs rolling baseline
        # Document-only two-path form: the benchmark already ran above, so
        # this step only renders the delta. Refusal, drift, missing-baseline,
        # and below-floor verdicts all stay advisory by construction.
        if: always() && (github.event_name != 'workflow_dispatch' || (inputs.smoke_mode || 'none') == 'none')
        continue-on-error: true
        env:
          PINNED_DRIFTED: ${{ steps.pinned-verify.outputs.drifted }}
        run: |
          if [ "${PINNED_DRIFTED}" = "true" ]; then
            echo "Pinned leg drifted or missing: raw-only timing, no trend delta."
            exit 0
          fi
          if [ ! -f previous/pinned-timing.json ] || [ ! -f reports/benchmarks/runs/pinned-timing.json ]; then
            echo "No prior baseline report: raw-only timing, no trend delta."
            exit 0
          fi
          python -m scripts.benchmark --compare previous/pinned-timing.json reports/benchmarks/runs/pinned-timing.json --min-improve-percent 15.0 || true
          true

      - name: Compare live leg vs rolling baseline
        # Live deltas render only when the live corpus hash matches the prior
        # live manifest; any drift falls back to raw absolutes, never a gate.
        if: always() && (github.event_name != 'workflow_dispatch' || (inputs.smoke_mode || 'none') == 'none')
        continue-on-error: true
        run: |
          if [ ! -f previous/live-timing.json ] || [ ! -f reports/benchmarks/runs/live-timing.json ]; then
            echo "No prior live report: raw-only timing, no trend delta."
            exit 0
          fi
          LIVE_PRE=$(python -c "import json,sys; data=json.load(open(sys.argv[1],encoding='utf-8')); print(data.get('manifest_sha256') or data.get('corpus',{}).get('manifest_sha256',''))" previous/live-timing.json 2>/dev/null || true)
          LIVE_POST=$(python -c "import json,sys; data=json.load(open(sys.argv[1],encoding='utf-8')); print(data.get('manifest_sha256') or data.get('corpus',{}).get('manifest_sha256',''))" reports/benchmarks/runs/live-timing.json 2>/dev/null || true)
          if [ -z "$LIVE_PRE" ] || [ "$LIVE_PRE" != "$LIVE_POST" ]; then
            echo "Live corpus drifted since baseline: raw-only timing, no trend delta."
            exit 0
          fi
          python -m scripts.benchmark --compare previous/live-timing.json reports/benchmarks/runs/live-timing.json --min-improve-percent 15.0 || true
          true

      - name: Render Advisory Summary
        # Advisory-labeled delta table per PERF-02, rendered through the
        # SUMMARY_PATH environment intermediary idiom. Always-run so the
        # summary lands even when legs or compares fail. Deltas render only
        # on manifest-digest equality (pinned drift flag clear with matching
        # prior pinned manifest; live hashes matching the prior live
        # manifest); drifted or baseline-less weeks render raw-only notes and
        # the job stays green by construction.
        if: always() && (github.event_name != 'workflow_dispatch' || (inputs.smoke_mode || 'none') == 'none')
        continue-on-error: true
        env:
          PINNED_DRIFTED: ${{ steps.pinned-verify.outputs.drifted }}
        run: |
          SUMMARY_PATH="$GITHUB_STEP_SUMMARY" PINNED_DRIFTED="$PINNED_DRIFTED" python - <<'PY'
          import json
          import os
          from pathlib import Path


          def _load(path):
              try:
                  data = json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return None
              return data if isinstance(data, dict) else None


          def _manifest(data):
              if not isinstance(data, dict):
                  return ""
              manifest = data.get("manifest_sha256")
              if not manifest:
                  corpus = data.get("corpus")
                  if isinstance(corpus, dict):
                      manifest = corpus.get("manifest_sha256", "")
              return manifest or ""


          def _median(data):
              if not isinstance(data, dict):
                  return ""
              median = data.get("median_seconds")
              if median is None:
                  summary = data.get("summary")
                  if isinstance(summary, dict):
                      median = summary.get("median_seconds")
              return "" if median is None else str(median)


          def _cell_median(data):
              median = _median(data)
              return f"{median} s" if median else "raw only"


          def _delta(fresh, baseline):
              try:
                  fresh_f = float(fresh)
                  base_f = float(baseline)
              except (TypeError, ValueError):
                  return "raw only"
              if base_f == 0:
                  return "raw only"
              pct = (fresh_f - base_f) / base_f * 100.0
              return f"{pct:+.1f}%"


          def _short(digest):
              if not digest:
                  return "unknown"
              return digest[:12] + "..." if len(digest) > 12 else digest


          pinned = _load("reports/benchmarks/runs/pinned-timing.json")
          live = _load("reports/benchmarks/runs/live-timing.json")
          prior_pinned = _load("previous/pinned-timing.json")
          prior_live = _load("previous/live-timing.json")
          drifted = os.environ.get("PINNED_DRIFTED", "true")

          lines = [
              "## Perf Evidence (advisory - cross-environment, non-gating)",
              "",
              "Evidence only: these numbers never gate publishing and this workflow is never a required check.",
              "",
              "| Leg | Median | Baseline | Delta | Corpus manifest |",
              "| --- | ------ | -------- | ----- | --------------- |",
          ]

          pinned_manifest = _manifest(pinned)
          prior_pinned_manifest = _manifest(prior_pinned)
          if drifted == "true" or pinned is None:
              lines.append(
                  f"| pinned timing | {_cell_median(pinned)} | - | raw only | "
                  f"{_short(pinned_manifest)} (pinned, drifted) |"
              )
          elif prior_pinned is None:
              lines.append(
                  f"| pinned timing | {_cell_median(pinned)} | - (first run) | raw only | "
                  f"{_short(pinned_manifest)} (pinned) |"
              )
          elif not pinned_manifest or pinned_manifest != prior_pinned_manifest:
              lines.append(
                  f"| pinned timing | {_cell_median(pinned)} | - | raw only | "
                  f"{_short(pinned_manifest)} (pinned, drifted) |"
              )
          else:
              lines.append(
                  f"| pinned timing | {_cell_median(pinned)} | {_cell_median(prior_pinned)} | "
                  f"{_delta(_median(pinned), _median(prior_pinned))} | "
                  f"{_short(pinned_manifest)} (pinned, match) |"
              )

          live_manifest = _manifest(live)
          prior_live_manifest = _manifest(prior_live)
          if live is None:
              lines.append("| live timing | raw only (missing) | - | raw only | unknown (live) |")
          elif prior_live is None:
              lines.append(
                  f"| live timing | {_cell_median(live)} | - (first run) | raw only | "
                  f"{_short(live_manifest)} (live) |"
              )
          elif not live_manifest or live_manifest != prior_live_manifest:
              lines.append(
                  f"| live timing | {_cell_median(live)} | - | raw only | "
                  f"{_short(live_manifest)} (live, drifted) |"
              )
          else:
              lines.append(
                  f"| live timing | {_cell_median(live)} | {_cell_median(prior_live)} | "
                  f"{_delta(_median(live), _median(prior_live))} | "
                  f"{_short(live_manifest)} (live, match) |"
              )

          with open(os.environ["SUMMARY_PATH"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines))
              summary.write("\n")
          print("advisory summary appended to step summary")
          PY

      - name: Upload Perf Evidence
        if: always() && (github.event_name != 'workflow_dispatch' || (inputs.smoke_mode || 'none') == 'none')
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: perf-evidence-${{ steps.stamp.outputs.date }}-${{ github.run_id }}
          path: |
            reports/benchmarks/runs/pinned-timing.json
            reports/benchmarks/runs/pinned-memory.json
            reports/benchmarks/runs/live-timing.json
            reports/benchmarks/runs/live-memory.json
            reports/perf-evidence/**
          if-no-files-found: warn
          retention-days: 90

      - name: Prepare Smoke Evidence
        id: smoke-prep
        if: github.event_name == 'workflow_dispatch' && inputs.smoke_mode != '' && inputs.smoke_mode != 'none'
        env:
          SMOKE_MODE: ${{ inputs.smoke_mode }}
        run: |
          mkdir -p reports/perf-evidence/smoke
          python -m scripts.perf_alert prepare-smoke --smoke-mode "$SMOKE_MODE" --output-dir reports/perf-evidence/smoke

      - name: Upload Smoke Evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.smoke_mode != '' && inputs.smoke_mode != 'none'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: perf-evidence-smoke-${{ steps.stamp.outputs.date }}-${{ github.run_id }}
          path: reports/perf-evidence/smoke/**
          if-no-files-found: warn
          retention-days: 7

      - name: Write Alert Context
        if: always()
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          GIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          SMOKE_MODE: ${{ inputs.smoke_mode || 'none' }}
          PERF_SNAPSHOT_DIGEST: ${{ env.PERF_SNAPSHOT_DIGEST }}
          PERF_SNAPSHOT_RUN_ID: ${{ env.PERF_SNAPSHOT_RUN_ID }}
          PINNED_DRIFTED: ${{ steps.pinned-verify.outputs.drifted }}
          BASELINE_RUN_ID: ${{ steps.baseline.outputs.run-id }}
          SMOKE_PINNED_DRIFTED: ${{ steps.smoke-prep.outputs.drifted }}
          SMOKE_BASELINE_RUN_ID: ${{ steps.smoke-prep.outputs.baseline-run-id }}
          OUTCOME_RESTORE: ${{ steps.restore.outcome }}
          OUTCOME_PINNED_TIMING: ${{ steps.pinned-timing.outcome }}
          OUTCOME_PINNED_MEMORY: ${{ steps.pinned-memory.outcome }}
          OUTCOME_FETCH: ${{ steps.fetch.outcome }}
          OUTCOME_LIVE_TIMING: ${{ steps.live-timing.outcome }}
          OUTCOME_LIVE_MEMORY: ${{ steps.live-memory.outcome }}
          OUTCOME_DOWNLOAD_PRIOR: ${{ steps.download-prior.outcome }}
        run: python -m scripts.perf_alert write-context --output reports/perf-evidence/alert-context.json

      - name: Stage Alert Handoff
        if: always()
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          SMOKE_MODE: ${{ inputs.smoke_mode || 'none' }}
        run: |
          HANDOFF=reports/perf-evidence/alert-handoff
          rm -rf "$HANDOFF"
          mkdir -p "$HANDOFF/runs" "$HANDOFF/previous"
          if [ -f reports/perf-evidence/alert-context.json ]; then
            cp reports/perf-evidence/alert-context.json "$HANDOFF/alert-context.json"
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$SMOKE_MODE" ] && [ "$SMOKE_MODE" != "none" ]; then
            SMOKE_DIR=reports/perf-evidence/smoke
            for f in "$SMOKE_DIR"/runs/*.json; do
              if [ -f "$f" ]; then
                cp "$f" "$HANDOFF/runs/"
              fi
            done
            for f in receipts.json source-health.json pinned-drifted; do
              if [ -f "$SMOKE_DIR/$f" ]; then
                cp "$SMOKE_DIR/$f" "$HANDOFF/$f"
              fi
            done
            for f in "$SMOKE_DIR"/previous/*.json; do
              if [ -f "$f" ]; then
                cp "$f" "$HANDOFF/previous/"
              fi
            done
          else
            for f in reports/benchmarks/runs/*.json; do
              if [ -f "$f" ]; then
                cp "$f" "$HANDOFF/runs/"
              fi
            done
            for f in receipts.json source-health.json pinned-drifted; do
              if [ -f "reports/perf-evidence/$f" ]; then
                cp "reports/perf-evidence/$f" "$HANDOFF/$f"
              fi
            done
            for f in previous/*.json; do
              if [ -f "$f" ]; then
                cp "$f" "$HANDOFF/previous/"
              fi
            done
          fi

      - name: Upload Alert Handoff
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: perf-alert-handoff-${{ github.run_id }}
          path: reports/perf-evidence/alert-handoff/**
          if-no-files-found: warn
          retention-days: 7

  perf_alert:
    needs: perf_evidence
    if: ${{ !cancelled() && (needs.perf_evidence.result == 'success' || needs.perf_evidence.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Python
        id: setup-python
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Download Alert Handoff
        if: steps.checkout.outcome == 'success' && steps.setup-python.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: perf-alert-handoff-${{ github.run_id }}
          path: alert-handoff

      - name: Evaluate and Sync Perf Alert
        if: steps.checkout.outcome == 'success' && steps.setup-python.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python -m scripts.perf_alert sync --handoff-dir alert-handoff
