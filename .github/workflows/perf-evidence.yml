# Perf Evidence: isolated weekly benchmark-evidence workflow (Phase 22).
# Advisory only: dated artifacts plus a 90-day retention window. This file
# never touches release lineage and never gates the 12h update workflow.
name: Perf Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2"  # Tue 03:17 UTC per D-22-01

# Snapshot lifecycle (seed-once story, D-22-04):
# - A one-off manual dispatch seeds the pinned corpus by uploading the fetch
#   output as a versioned snapshot artifact carrying the name below.
# - Refresh is deliberate: a human PR touches only PERF_SNAPSHOT_DIGEST and
#   PERF_SNAPSHOT_RUN_ID below, nothing else in this file.
# - Snapshot bytes are never committed to git and never travel through a
#   shared runner-cache key family; the pinned leg restores artifact bytes
#   only, and the live leg fetches into its own scratch directories.
env:
  SOURCES: config/sources.txt
  RAW_DIR: lists/_raw
  PERF_SNAPSHOT_DIGEST: ecd3b62468c78c0c49a850f569f16fd9dcb82743b9764a04b4f9c9c72926f27b
  PERF_SNAPSHOT_ARTIFACT: perf-snapshot-ecd3b62468c7
  # Placeholder until the seed-once manual dispatch lands; replace with that
  # run's numeric id by human PR (see the lifecycle note above).
  PERF_SNAPSHOT_RUN_ID: "0"
  PINNED_DIR: reports/perf-evidence/pinned-corpus

permissions: {}

concurrency:
  group: perf-evidence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  perf_evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: python -m pip install -q -c constraints/release-py314.txt ".[dev]"

      - name: Prepare Evidence Directories
        run: mkdir -p reports/perf-evidence reports/benchmarks/runs previous "$PINNED_DIR"

      - name: Stamp Evidence Date
        id: stamp
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore pinned snapshot
        id: restore
        # Graceful by design: a missing snapshot (pre-seed, expiry) skips the
        # pinned legs below and the week degrades to raw-only, job stays green.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ env.PERF_SNAPSHOT_ARTIFACT }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.PERF_SNAPSHOT_RUN_ID }}
          path: ${{ env.PINNED_DIR }}

      - name: Run pinned timing leg
        if: steps.restore.outcome == 'success'
        run: |
          python -m scripts.benchmark --corpus "$PINNED_DIR" --runs 3 \
            --json reports/benchmarks/runs/pinned-timing.json

      - name: Run pinned memory leg
        if: steps.restore.outcome == 'success'
        run: |
          python -m scripts.benchmark --corpus "$PINNED_DIR" \
            --track-memory --json reports/benchmarks/runs/pinned-memory.json

      - name: Verify pinned manifest
        id: pinned-verify
        # Post-leg gate: restored bytes must match the env-pinned digest before
        # any trend delta is credited. Drift (or a missing leg) writes the
        # marker plus output flag and the week goes raw-only, job stays green.
        if: always()
        run: |
          PINNED_REPORT=reports/benchmarks/runs/pinned-timing.json
          DRIFTED=true
          if [ -f "$PINNED_REPORT" ]; then
            STAMPED=$(python -c "import json,sys; data=json.load(open(sys.argv[1],encoding='utf-8')); print(data.get('manifest_sha256') or data.get('corpus',{}).get('manifest_sha256',''))" "$PINNED_REPORT" 2>/dev/null || true)
            if [ -n "$STAMPED" ] && [ "$STAMPED" = "$PERF_SNAPSHOT_DIGEST" ]; then
              DRIFTED=false
            fi
          fi
          if [ "$DRIFTED" = "true" ]; then
            echo "Pinned leg drifted or missing: marking raw-only, job stays green."
            : > reports/perf-evidence/pinned-drifted
          fi
          echo "drifted=${DRIFTED}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Download Prior Perf Evidence (skeleton)
        # 22-02 wires the baseline run-id resolver; the skeleton only pins the
        # supply-chain surface and stays inert until then.
        if: false
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: perf-evidence-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.run_id }}
          path: previous

      - name: Upload Perf Evidence (skeleton)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: perf-evidence-${{ steps.stamp.outputs.date }}-${{ github.run_id }}
          path: |
            reports/perf-evidence/**
            reports/benchmarks/**
          if-no-files-found: warn
          retention-days: 90
